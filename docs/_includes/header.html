<header class="site-header">
  <nav class="site-nav" aria-label="Main">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">{% include logo.svg %}</span>
      <span class="brand-text">
        <span class="brand-kicker">Codicent</span>
        <span class="brand-name">Muse</span>
      </span>
    </a>
    <div class="nav-links">
      {% for item in site.nav %}
      {% assign item_path = item.url | relative_url %}
      <a class="nav-link{% if page.url == item.url %} is-active{% endif %}" href="{{ item_path }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a class="btn btn-ghost btn-sm" href="{{ site.repo_url }}">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.3 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/></svg>
        GitHub
      </a>
    </div>
  </nav>
</header>
